databaseChangeLog:
  - changeSet:
      id: 69
      author: Valentin Futterer
      comment: Add table to store active connections between DMP Datasets and records
      changes:
        - createSequence:
            sequenceName: dataset_record_link_seq
            startValue: 1
            incrementBy: 50

        - createTable:
            tableName: dataset_record_link
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_dataset_record_link
                    nullable: false

              - column:
                  name: dataset_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: external_record
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - addForeignKeyConstraint:
                  baseTableName: dataset_record_link
                  baseColumnNames: dataset_id
                  referencedTableName: dataset
                  referencedColumnNames: id
                  constraintName: fk_dataset_record_link_dataset
                  onDelete: CASCADE